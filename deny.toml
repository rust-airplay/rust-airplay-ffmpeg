# cargo-deny policy for rust-airplay-ffmpeg.
#
# Three questions are answered here: are there known vulnerabilities in the resolved
# dependency tree, are all of those crates licensed in a way this GPL-3.0-or-later crate can
# ship, and did every crate come from crates.io rather than from a git branch or a private
# registry. Run locally with `cargo deny check`; CI runs it on every push.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
# Everything the RustSec database reports is denied. There is no ignore list: this crate
# links no C library, so its tree is small enough that an advisory should stop a release
# rather than be recorded as a trade-off.

[licenses]
# The published crate is GPL-3.0-or-later, which is compatible with every license listed
# here. A new dependency under an unfamiliar license fails the check until it is added
# deliberately.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
# Duplicate versions are not an error by themselves, but each one is a crate the audit
# covers twice, so the report is a warning the reviewer sees on every run.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
